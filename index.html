<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tickets">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme:dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Tickets</title>
<style>
:root{--bg:#F2F2F7;--card:#FFF;--ink:#111;--muted:#6C6C70;--line:#DCDCE1;--search:#E3E3E9;
  --accent:#0066D6;--red:#E5383B;--yellow:#D98E04;--green:#248A3D}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1C1C1E;--ink:#F2F2F7;--muted:#98989F;
  --line:#38383A;--search:#1C1C1E;--accent:#409CFF;--red:#FF6961;--yellow:#FFB340;--green:#4CD964}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:640px;background:var(--bg);color:var(--ink);
  font:400 17px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 100px)}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:34px;font-weight:700}
.link{color:var(--accent);font-size:16px}
.search{width:100%;margin:14px 0 10px;padding:10px 14px;border:0;border-radius:10px;
  background:var(--search);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:8px}
.chip{flex:none;padding:6px 14px;border-radius:999px;background:var(--card);font-size:14px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.head{margin:18px 14px 6px;font-size:13px;color:var(--muted)}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px}
.row+.row{border-top:1px solid var(--line)}
.row:active{background:var(--search)}
.row>.dot{flex:none;width:10px;height:10px;border-radius:50%;background:currentColor}
.row .text{flex:1;min-width:0;color:var(--ink)}
.row h2{margin:0;font-size:17px;font-weight:500;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.gist{margin:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);font-size:20px}
.red{color:var(--red)}.yellow{color:var(--yellow)}.green{color:var(--green)}
.empty{padding:52px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:56px;height:56px;
  border-radius:50%;background:var(--accent);color:#FFF;font-size:30px;display:grid;place-items:center}
dialog{width:100%;max-width:560px;margin:auto auto 0;padding:0;border:0;color:var(--ink);
  background:var(--bg);border-radius:16px 16px 0 0;max-height:92dvh}
@media (min-width:600px){dialog{margin:auto;border-radius:16px}}
dialog::backdrop{background:#0008}
.pane{position:relative;padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);overflow-y:auto;max-height:92dvh}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet-title{margin:0 0 3px;font-size:22px;font-weight:600;padding-right:38px}
.sheet-meta{font-size:13px;color:var(--muted);margin-bottom:18px}
.x{position:absolute;top:12px;right:16px;width:30px;height:30px;color:var(--muted)}
.seg{display:flex;gap:4px;margin-bottom:20px;padding:3px;border-radius:10px;background:var(--search)}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);font-weight:600}
.seg button.red[aria-pressed=true]{color:var(--red)}
.seg button.yellow[aria-pressed=true]{color:var(--yellow)}
.seg button.green[aria-pressed=true]{color:var(--green)}
.seg .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:currentColor}
.field{margin-bottom:14px;padding:10px 14px;border-radius:12px;background:var(--card)}
.field h3{margin:0 0 3px;font-size:12px;font-weight:400;color:var(--muted)}
.field p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.field code{font:14px ui-monospace,Menlo,monospace;background:var(--search);padding:2px 5px;border-radius:4px}
.acts{display:flex;gap:9px;padding-top:4px}
.btn{flex:1;padding:13px;border-radius:12px;background:var(--card);color:var(--accent)}
.btn.primary{background:var(--accent);color:#FFF;font-weight:600}
.quiet{display:block;width:100%;margin-top:14px;padding:10px;color:var(--red)}
label{display:block;margin-bottom:14px;font-size:13px;color:var(--muted)}
label input,label select,label textarea{display:block;width:100%;margin-top:5px;padding:11px 13px;
  font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px}
label textarea{min-height:80px;resize:vertical}
#pasteText{min-height:220px;font:14px/1.5 ui-monospace,Menlo,monospace}
.err{color:var(--red);font-size:14px;margin:0 0 14px}.err:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);translate:-50% 0;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="top">
  <h1>Tickets</h1>
  <button class="link" id="pasteOpen">paste from chat</button>
</div>

<input class="search" id="q" type="search" placeholder="Search" autocomplete="off">
<div class="chips" id="chips"></div>
<div id="list"></div>

<button class="fab" id="add" aria-label="New ticket"><span>+</span></button>
<div class="toast" id="toast" role="status"></div>

<dialog id="sheet"><div class="pane">
  <div class="grab"></div>
  <h2 class="sheet-title" id="dTitle"></h2>
  <div class="sheet-meta" id="dMeta"></div>
  <div class="seg" id="dSeg"></div>
  <div id="dFields"></div>
  <div class="acts">
    <button class="btn primary" id="dEdit"><span>Edit</span></button>
    <button class="btn" id="dCopy"><span>Copy for chat</span></button>
  </div>
  <button class="quiet" id="dDelete">Delete ticket</button>
  <button class="x" id="dClose" aria-label="Close">&#10005;</button>
</div></dialog>

<dialog id="editor"><form class="pane" id="form">
  <div class="grab"></div>
  <h2 class="sheet-title" id="fTitle">New ticket</h2>
  <div style="height:16px"></div>
  <label>Title<input name="title" required maxlength="120"
    placeholder="What is broken"></label>
  <label>Section<select name="section">
    <option>Networking</option><option>HA</option><option>Proxmox</option>
    </select></label>
  <label>Status<select name="status">
    <option value="red">Open</option><option value="yellow">Partly fixed</option>
    <option value="green">Fixed</option></select></label>
  <label>Problem<textarea name="problem" placeholder="What you saw"></textarea></label>
  <label>Cause<textarea name="cause" placeholder="Why it happened"></textarea></label>
  <label>Fix<textarea name="fix" placeholder="What made it work"></textarea></label>
  <label>Still open<textarea name="open" placeholder="Left to do"></textarea></label>
  <p class="err" id="fErr"></p>
  <div class="acts">
    <button class="btn primary" type="submit"><span>Save</span></button>
    <button class="btn" type="button" id="fCancel"><span>Cancel</span></button>
  </div>
</form></dialog>

<dialog id="paster"><div class="pane">
  <div class="grab"></div>
  <h2 class="sheet-title">Paste from chat</h2>
  <div style="height:16px"></div>
  <label>Paste the filled template and review it before saving.
    <textarea id="pasteText" placeholder="Title: Immich unreachable
Section: Proxmox
Status: yellow
Problem: Down, even on the local network
Cause: Photo share did not mount at boot
Fix: Mount the share, restart the container
Still open: Stop it happening after a power cut"></textarea></label>
  <p class="err" id="pErr"></p>
  <div class="acts">
    <button class="btn primary" id="pRead"><span>Review</span></button>
    <button class="btn" id="pCancel"><span>Cancel</span></button>
  </div>
</div></dialog>

<script>
const $ = id => document.getElementById(id);
const SECTIONS = ['Networking', 'HA', 'Proxmox'];
const STATUS = {red: 'open', yellow: 'partly fixed', green: 'fixed'};
const LABELS = {problem: 'Problem', cause: 'Cause', fix: 'Fix', open: 'Still open'};
const KEYS = {title: 'title', section: 'section', status: 'status', problem: 'problem',
              cause: 'cause', fix: 'fix', 'still open': 'open'};
let all = [], section = 'All', query = '', current = null;

/* ---------- helpers ---------- */
const esc = s => s.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]));
const code = s => esc(s).replace(/`([^`\n]+)`/g, '<code>$1</code>');
const serial = id => '#' + String(id).padStart(3, '0');
const gist = t => (t.problem || '').replace(/`/g, '').replace(/\s+/g, ' ').trim();

function rel(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '';
  const days = Math.floor((new Date().setHours(0,0,0,0) - new Date(iso).setHours(0,0,0,0)) / 864e5);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + ' days ago';
  return d.toLocaleDateString(undefined, {day: 'numeric', month: 'short',
    year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric'});
}

function toast(msg) {
  $('toast').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('show'), 1800);
}

function copy(text) {
  if (navigator.clipboard && isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.append(ta); ta.select();
  const ok = document.execCommand('copy'); ta.remove();
  return ok ? Promise.resolve() : Promise.reject();
}

function asTemplate(t) {
  return [`Ticket ${serial(t.id)}, opened ${t.created.slice(0, 10)}`,
          `Title: ${t.title}`, `Section: ${t.section}`, `Status: ${t.status}`,
          `Problem: ${t.problem}`, `Cause: ${t.cause}`, `Fix: ${t.fix}`,
          `Still open: ${t.open}`].join('\n');
}

/* ---------- list ---------- */
async function load() {
  try {
    const r = await fetch('/api/tickets');
    if (!r.ok) throw 0;
    all = await r.json();
    render();
  } catch {
    $('list').innerHTML = '<div class="empty"><b>No connection</b>' +
      'The server is not answering. Check it is running on this machine.</div>';
  }
}

function render() {
  $('chips').replaceChildren(...['All', ...SECTIONS].map(s => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.append(s);
    b.setAttribute('aria-pressed', section === s);
    b.onclick = () => { section = s; render(); };
    return b;
  }));

  const shown = all.filter(t =>
    (section === 'All' || t.section === section) &&
    (!query || serial(t.id).includes(query) ||
     Object.values(KEYS).some(k => (t[k] || '').toLowerCase().includes(query))));

  if (!shown.length) {
    const blank = !all.length;
    $('list').innerHTML = '<div class="empty"><b>' +
      (blank ? 'Nothing logged yet' : 'No match') + '</b>' +
      (blank ? 'Tap + to log the first fix.' : 'Try another word or clear the filters.') + '</div>';
    return;
  }

  const row = t => {
    const b = document.createElement('button');
    b.className = 'row ' + t.status;
    const g = gist(t);
    b.innerHTML =
      '<i class="dot" aria-hidden="true"></i><div class="text">' +
      `<h2>${esc(t.title)}</h2>` +
      `<div class="meta">${serial(t.id)} · ${esc(t.section)} · ${rel(t.created)}</div>` +
      (g ? `<p class="gist">${esc(g)}</p>` : '') +
      '</div><span class="chev" aria-hidden="true">›</span>';
    b.onclick = () => detail(t);
    return b;
  };

  $('list').replaceChildren(...Object.keys(STATUS).flatMap(s => {
    const items = shown.filter(t => t.status === s);
    if (!items.length) return [];
    const head = document.createElement('div');
    head.className = 'head';
    head.textContent = `${STATUS[s][0].toUpperCase() + STATUS[s].slice(1)} · ${items.length}`;
    const group = document.createElement('div');
    group.className = 'group';
    group.append(...items.map(row));
    return [head, group];
  }));
}

/* ---------- detail ---------- */
function detail(t) {
  current = t;
  $('dTitle').textContent = t.title;
  $('dMeta').innerHTML =
    `<span style="margin-right:14px">${serial(t.id)}</span>` +
    `<span style="margin-right:14px">${esc(t.section)}</span>` +
    `<span>opened ${rel(t.created)}` +
    (t.updated.slice(0, 10) !== t.created.slice(0, 10) ? `, updated ${rel(t.updated)}` : '') +
    '</span>';
  $('dSeg').replaceChildren(...Object.keys(STATUS).map(s => {
    const b = document.createElement('button');
    b.className = s;
    b.setAttribute('aria-pressed', t.status === s);
    b.innerHTML = `<i class="dot"></i><span>${STATUS[s]}</span>`;
    b.onclick = () => { if (t.status !== s) save({...t, status: s}, t.id, false); };
    return b;
  }));
  $('dFields').innerHTML = Object.keys(LABELS).filter(k => t[k]).map(k =>
    `<div class="field"><h3>${LABELS[k]}</h3><div class="${k === 'open' ? 'open-note' : ''}">` +
    `<p>${code(t[k])}</p></div></div>`).join('') ||
    '<div class="field"><p style="color:var(--muted)">No notes yet. Tap Edit to add them.</p></div>';
  $('dDelete').textContent = 'Delete ticket';
  $('dDelete').dataset.armed = '';
  $('sheet').showModal();
}

$('dClose').onclick = () => $('sheet').close();
$('dEdit').onclick = () => { $('sheet').close(); openForm(current, current.id); };
$('dCopy').onclick = () => copy(asTemplate(current))
  .then(() => toast('Copied')).catch(() => toast('Could not copy'));
$('dDelete').onclick = async e => {
  if (!e.target.dataset.armed) {
    e.target.dataset.armed = '1';
    e.target.textContent = 'Delete for good?';
    return;
  }
  const r = await fetch('/api/tickets/' + current.id, {method: 'DELETE'});
  $('sheet').close();
  toast(r.ok ? 'Deleted' : 'Could not delete');
  load();
};

/* ---------- editor ---------- */
function openForm(t, id) {
  current = id ? current : null;
  $('form').reset();
  $('fErr').textContent = '';
  $('fTitle').textContent = id ? 'Edit ticket' : 'New ticket';
  for (const k of Object.values(KEYS)) if (t[k]) $('form').elements[k].value = t[k];
  $('editor').showModal();
  $('editor').dataset.id = id || '';
}

$('add').onclick = () => openForm({section: section === 'All' ? 'Networking' : section,
                                   status: 'red'}, null);
$('fCancel').onclick = () => $('editor').close();

$('form').onsubmit = e => {
  e.preventDefault();
  save(Object.fromEntries(new FormData($('form'))), $('editor').dataset.id || null, true);
};

async function save(body, id, fromForm) {
  try {
    const r = await fetch('/api/tickets' + (id ? '/' + id : ''), {
      method: id ? 'PUT' : 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)});
    if (!r.ok) throw new Error((await r.json()).error || 'Could not save');
    if (fromForm) $('editor').close(); else $('sheet').close();
    await load();
    toast('Saved');
  } catch (err) {
    if (fromForm) $('fErr').textContent = err.message;
    else toast(err.message);
  }
}

/* ---------- paste ---------- */
function parse(text) {
  const t = {};
  let key = null;
  for (const line of text.split('\n')) {
    const m = line.replace(/\*\*/g, '')
      .match(/^\s*[-*]?\s*(title|section|status|problem|cause|fix|still open)\s*:\s*(.*)$/i);
    if (m) { key = KEYS[m[1].toLowerCase()]; t[key] = m[2]; }
    else if (key) t[key] += '\n' + line;
  }
  for (const k in t) t[k] = t[k].trim();
  const low = (t.status || '').toLowerCase();
  t.status = Object.keys(STATUS).find(k => low.includes(k) || low.includes(STATUS[k])) || 'red';
  t.section = SECTIONS.find(s => s.toLowerCase() === (t.section || '').toLowerCase()) || '';
  return t;
}

$('pasteOpen').onclick = () => {
  $('pasteText').value = ''; $('pErr').textContent = ''; $('paster').showModal();
};
$('pCancel').onclick = () => $('paster').close();
$('pRead').onclick = () => {
  const t = parse($('pasteText').value);
  if (!t.title) { $('pErr').textContent = 'No line starting with "Title:" found.'; return; }
  $('paster').close();
  openForm(t, null);
  if (!t.section) {
    $('form').elements.section.value = '';
    $('fErr').textContent = 'Choose a section to save this.';
  }
};

$('q').oninput = e => { query = e.target.value.trim().toLowerCase(); render(); };
for (const d of document.querySelectorAll('dialog'))
  d.onclick = e => { if (e.target === d) d.close(); };

load();
</script>
</body>
</html>
